<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="/css/login.css">
    <script src="https://kit.fontawesome.com/c8209eb60a.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="container">
        <img src="https://images.unsplash.com/photo-1589691962030-8d2b7f2a1ffe?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="">
        <div id="right">
            <h1>Login</h1>
        <div id="emailbox">
            <input type="email" placeholder="Email" >
            <div id="emailicon"><i class="fa-solid fa-envelope"></i></div>
        </div>
        <div id="passwordbox">
            <input type="password" placeholder="Password">
            <div id="passwordicon"><i class="fa-solid fa-lock"></i></div>
        </div>
            <button id="loginbtn">Login</button>
            <div id="link">
                <div id="createaccount">Create an account</div>
                <div id="forgotpassword">Forgot your password</div>
            </div>
        </div>
    </div>
</body>
</html>
